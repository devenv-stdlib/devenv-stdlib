name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref groups so stacked PR Docs builds do not cancel each other.
# A shared `pages` group made required `build` fail with:
# "Canceling since a higher priority waiting request for pages exists".
concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Build docs
        run: npm run build
        env:
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  # Ruleset requires bare check context "build".
  ruleset-build:
    name: build
    needs: build-docs
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require docs build success
        run: test "${{ needs.build-docs.result }}" = "success"

  deploy-pages:
    name: Deploy docs to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build-docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy pages artifact
        uses: actions/deploy-pages@v4
