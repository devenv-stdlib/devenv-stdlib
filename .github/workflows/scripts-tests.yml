name: scripts tests

# Deliberately no branches/tags filter: with neither defined the workflow runs
# for branch pushes and tag pushes alike, and GitHub skips path filters on tag
# pushes. So this runs whenever anything under scripts/ changes, and on tags.
on:
  push:
    paths:
      - scripts/**
      - tests/scripts/**
      - .github/workflows/scripts-tests.yml
  pull_request:
    paths:
      - scripts/**
      - tests/scripts/**
      - .github/workflows/scripts-tests.yml

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Same files the shellcheck commit hook covers, so CI and the hook agree.
      - name: Lint the scripts and their tests
        run: nix shell nixpkgs#shellcheck --command shellcheck scripts/*.sh tests/scripts/*.bats

      - name: Run the scripts test suite
        run: nix shell nixpkgs#bats nixpkgs#shellcheck --command bats --print-output-on-failure tests/scripts
