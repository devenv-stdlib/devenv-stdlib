name: Hooks

on:
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: hooks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Own workspace under act
        if: ${{ env.ACT }}
        run: |
          sudo mkdir -p /home/runner/.cache/nix /nix
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" /home/runner/.cache /nix

      - uses: cachix/install-nix-action@v31

      - name: Restore Nix store
        id: nix-cache
        if: ${{ !env.ACT }}
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix', 'modules/hooks/**', 'modules/debtmap/hooks.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: |
          # Pin CLI to the locked modules rev (devenv.yaml require_version: true).
          rev="$(jq -r '.nodes.devenv.locked.rev' devenv.lock)"
          nix profile add "github:cachix/devenv/${rev}"

      - name: Run prek
        id: prek
        run: |
          set -uo pipefail

          marker='<!-- prek-hooks-report -->'
          repo='${{ github.repository }}'
          comment_ids() {
            gh api --paginate "repos/${repo}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("<!-- prek-hooks-report -->")) | .id'
          }
          delete_report_comments() {
            local id
            while read -r id; do
              [ -z "$id" ] && continue
              gh api --method DELETE "repos/${repo}/issues/comments/${id}" >/dev/null
            done < <(comment_ids)
          }
          upsert_report_comment() {
            local payload id extras
            payload=$(jq -n --rawfile body "$1" '{body: $body}')
            id=$(comment_ids | head -n1 || true)
            if [ -n "$id" ]; then
              gh api --method PATCH "repos/${repo}/issues/comments/${id}" --input - <<<"$payload" >/dev/null
              extras=$(comment_ids | tail -n +2 || true)
              while read -r id; do
                [ -z "$id" ] && continue
                gh api --method DELETE "repos/${repo}/issues/comments/${id}" >/dev/null
              done <<<"$extras"
            else
              gh api --method POST "repos/${repo}/issues/${PR_NUMBER}/comments" --input - <<<"$payload" >/dev/null
            fi
          }
          write_comment_body() {
            {
              bt='`'
              fence='````'
              printf '%s\n\n' "$marker"
              printf '%s\n\n' "## prek failed on this pull request"
              printf '%s\n\n' "${bt}prek run --all-files${bt} did not pass. Output:"
              printf '%s\n' "$fence"
              if [ -s prek.log ]; then
                head -c 50000 prek.log
                echo
              else
                echo "(prek produced no output)"
              fi
              printf '%s\n\n' "$fence"
              printf '%s\n' "Fix locally with ${bt}devenv shell${bt} and ${bt}prek run --all-files${bt}, or commit on the host so hooks run."
            } >prek-comment.md
          }

          set +e
          devenv shell -- prek run --all-files --show-diff-on-failure --color=never \
            2>&1 | tee prek.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            write_comment_body
            upsert_report_comment prek-comment.md \
              || echo "::warning::Could not comment on the pull request with prek output"
            exit "$status"
          fi
          delete_report_comments || true

      - name: Upload prek log
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: prek.log
          path: prek.log
          if-no-files-found: ignore

      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ always() && !env.ACT }}
        with:
          msg: "chore: apply hook autofixes"

      - name: Save Nix store
        if: ${{ always() && !env.ACT && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G

      - name: Save Nix store
        if: ${{ always() && !env.ACT && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G
