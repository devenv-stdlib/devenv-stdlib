name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters on pull_request only; push to main/master always runs the full suite
  # (release gate). Ruleset shims treat intentional path-skips as success.
  changes:
    name: Detect path changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.flags.outputs.unit }}
      integration: ${{ steps.flags.outputs.integration }}
      language: ${{ steps.flags.outputs.language }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            unit:
              - '**/*.nix'
              - 'devenv.lock'
              - 'devenv.yaml'
              - 'devenv.nix'
              - 'flake.nix'
              - 'flake.lock'
              - 'copier.yml'
              - 'modules/**'
              - 'stdlib/**'
              - 'presets/**'
              - 'packaging/**'
              - 'tools/**'
              - 'home/**'
              - 'tests/**'
              - '!tests/setup/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test.yml'
            integration:
              - '**/*.nix'
              - 'devenv.lock'
              - 'devenv.yaml'
              - 'devenv.nix'
              - 'flake.nix'
              - 'flake.lock'
              - 'modules/**'
              - 'stdlib/**'
              - 'presets/**'
              - 'packaging/**'
              - 'tests/integration/**'
              - 'tests/act/**'
              - 'tests/unit/workflow.nix'
              - 'tests/fixtures/**'
              - '.github/**'
              - '.actrc'
            language:
              - '**/*.nix'
              - 'devenv.lock'
              - 'devenv.yaml'
              - 'devenv.nix'
              - 'modules/languages/**'
              - 'presets/**'
              - '.github/workflows/test.yml'
              - '.github/workflows/ci.yml'

      - id: flags
        name: Resolve suite flags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "unit=true"
              echo "integration=true"
              echo "language=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "unit=${{ steps.filter.outputs.unit }}"
              echo "integration=${{ steps.filter.outputs.integration }}"
              echo "language=${{ steps.filter.outputs.language }}"
            } >> "$GITHUB_OUTPUT"
          fi

  # Fail-fast gate: lint before unit/integration/language matrix/release.
  # Display name is human-readable; ruleset still requires the bare check "prek".
  lint:
    name: Lint (prek)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Own workspace under act
        if: ${{ env.ACT }}
        run: |
          sudo mkdir -p /home/runner/.cache/nix /nix
          # Nested act matrix cells share one /nix volume; recursive chown races with
          # concurrent nix creating/removing .lock files (ENOENT → non-zero under bash -e).
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" /home/runner/.cache
          if ! sudo chown -R "$(id -u):$(id -g)" /nix; then
            sudo chown "$(id -u):$(id -g)" /nix
          fi

      - uses: cachix/install-nix-action@v31

      - name: Restore Nix store
        id: nix-cache
        if: ${{ !env.ACT }}
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix', 'modules/hooks/**', 'modules/debtmap/hooks.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: |
          # Pin CLI to the locked modules rev (matches devenv.yaml require_version).
          rev="$(jq -r '.nodes.devenv.locked.rev' devenv.lock)"
          nix profile add "github:cachix/devenv/${rev}"

      - name: Run prek
        id: prek
        run: |
          set -uo pipefail

          marker='<!-- prek-hooks-report -->'
          repo='${{ github.repository }}'
          comment_ids() {
            gh api --paginate "repos/${repo}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("<!-- prek-hooks-report -->")) | .id'
          }
          delete_report_comments() {
            local id
            while read -r id; do
              [ -z "$id" ] && continue
              gh api --method DELETE "repos/${repo}/issues/comments/${id}" >/dev/null
            done < <(comment_ids)
          }
          upsert_report_comment() {
            local payload id extras
            payload=$(jq -n --rawfile body "$1" '{body: $body}')
            id=$(comment_ids | head -n1 || true)
            if [ -n "$id" ]; then
              gh api --method PATCH "repos/${repo}/issues/comments/${id}" --input - <<<"$payload" >/dev/null
              extras=$(comment_ids | tail -n +2 || true)
              while read -r id; do
                [ -z "$id" ] && continue
                gh api --method DELETE "repos/${repo}/issues/comments/${id}" >/dev/null
              done <<<"$extras"
            else
              gh api --method POST "repos/${repo}/issues/${PR_NUMBER}/comments" --input - <<<"$payload" >/dev/null
            fi
          }
          write_comment_body() {
            {
              bt='`'
              fence='````'
              printf '%s\n\n' "$marker"
              printf '%s\n\n' "## prek failed on this pull request"
              printf '%s\n\n' "${bt}prek run --all-files${bt} did not pass. Output:"
              printf '%s\n' "$fence"
              if [ -s prek.log ]; then
                head -c 50000 prek.log
                echo
              else
                echo "(prek produced no output)"
              fi
              printf '%s\n\n' "$fence"
              printf '%s\n' "Fix locally with ${bt}devenv shell${bt} and ${bt}prek run --all-files${bt}, or commit on the host so hooks run."
            } >prek-comment.md
          }

          set +e
          devenv shell -- prek run --all-files --show-diff-on-failure --color=never \
            2>&1 | tee prek.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              write_comment_body
              upsert_report_comment prek-comment.md \
                || echo "::warning::Could not comment on the pull request with prek output"
            fi
            exit "$status"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            delete_report_comments || true
          fi

      - name: Upload prek log
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: prek.log
          path: prek.log
          if-no-files-found: ignore

      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ always() && !env.ACT && github.event_name == 'pull_request' }}
        with:
          msg: "chore: apply hook autofixes"

      - name: Save Nix store
        if: ${{ always() && !env.ACT && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G

  # Ruleset requires bare check context "prek" (was hooks.yml job id).
  ruleset-prek:
    name: prek
    needs: lint
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require lint success
        run: test "${{ needs.lint.result }}" = "success"

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    needs: [lint, changes]
    if: needs.lint.result == 'success' && needs.changes.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: read
      actions: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Own workspace under act
        if: ${{ env.ACT }}
        run: |
          sudo mkdir -p /home/runner/.cache/nix /nix
          # Volume-mounted /nix is root-owned; single-user install-nix needs runner.
          # Nested act matrix cells share one /nix volume; recursive chown races with
          # concurrent nix creating/removing .lock files (ENOENT → non-zero under bash -e).
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" /home/runner/.cache
          if ! sudo chown -R "$(id -u):$(id -g)" /nix; then
            sudo chown "$(id -u):$(id -g)" /nix
          fi

      - uses: cachix/install-nix-action@v31

      # Combined cache-nix-action only saves on success(); failed jobs never
      # populated test-devenv keys. Restore + always-save fills Actions cache.
      - name: Restore Nix store
        id: nix-cache
        if: ${{ !env.ACT }}
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ matrix.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix') }}
          restore-prefixes-first-match: nix-${{ matrix.os }}-${{ github.job }}-

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: |
          # Pin CLI to the locked modules rev (matches devenv.yaml require_version).
          rev="$(jq -r '.nodes.devenv.locked.rev' devenv.lock)"
          nix profile add "github:cachix/devenv/${rev}"

      - name: Unit suite
        # --show-output: devenv tasks hide captured stdout unless showOutput / this flag
        run: devenv tasks run --show-output devenv:test-devenv-unit

      - name: Upload JUnit reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-tests-${{ matrix.os }}
          path: junit/**/*.xml
          if-no-files-found: ignore

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit tests results (${{ matrix.os }})
          files: |
            junit/**/*.xml
          comment_mode: always
          check_run_annotations: none

      - name: Save Nix store
        if: ${{ always() && !env.ACT && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G

  # Ruleset requires "test-devenv-unit (ubuntu-…)". Human-readable matrix jobs use
  # different display names; these shims keep the required contexts green/red.
  ruleset-unit-tests:
    name: test-devenv-unit (${{ matrix.os }})
    needs: [changes, unit-tests]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ubuntu-24.04
    steps:
      - name: Require unit matrix success or path-skip
        run: |
          if [ "${{ needs.changes.outputs.unit }}" != "true" ]; then
            echo "path-skip: unit suite not required for this PR"
            exit 0
          fi
          test "${{ needs.unit-tests.result }}" = "success"

  # Integration runs when its paths match; waits for unit only if unit also ran.
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    needs: [lint, changes, unit-tests]
    if: >-
      always()
      && !cancelled()
      && needs.lint.result == 'success'
      && needs.changes.outputs.integration == 'true'
      && (needs.changes.outputs.unit != 'true' || needs.unit-tests.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: read
      actions: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Own workspace under act
        if: ${{ env.ACT }}
        run: |
          sudo mkdir -p /home/runner/.cache/nix /nix
          # Volume-mounted /nix is root-owned; single-user install-nix needs runner.
          # Nested act matrix cells share one /nix volume; recursive chown races with
          # concurrent nix creating/removing .lock files (ENOENT → non-zero under bash -e).
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" /home/runner/.cache
          if ! sudo chown -R "$(id -u):$(id -g)" /nix; then
            sudo chown "$(id -u):$(id -g)" /nix
          fi

      - uses: cachix/install-nix-action@v31

      - name: Restore Nix store
        id: nix-cache
        if: ${{ !env.ACT }}
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ matrix.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix') }}
          restore-prefixes-first-match: nix-${{ matrix.os }}-${{ github.job }}-

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: |
          # Pin CLI to the locked modules rev (matches devenv.yaml require_version).
          rev="$(jq -r '.nodes.devenv.locked.rev' devenv.lock)"
          nix profile add "github:cachix/devenv/${rev}"

      - name: Integration suite
        # --show-output: devenv tasks hide captured stdout unless showOutput / this flag
        # GITHUB_TOKEN: nested act forwards this (and MISE_GITHUB_TOKEN/GH_TOKEN) so mise
        # can install github:/ubi: release tools (debtmap). Empty/dummy tokens → 401/403.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: devenv tasks run --show-output devenv:test-devenv-integration

      - name: Upload JUnit reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-tests-${{ matrix.os }}
          path: junit/**/*.xml
          if-no-files-found: ignore

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Integration tests results (${{ matrix.os }})
          files: |
            junit/**/*.xml
          comment_mode: always
          check_run_annotations: none

      - name: Save Nix store
        if: ${{ always() && !env.ACT && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G

  # Ruleset requires "test-devenv (ubuntu-…)".
  ruleset-integration-tests:
    name: test-devenv (${{ matrix.os }})
    needs: [changes, integration-tests]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ubuntu-24.04
    steps:
      - name: Require integration matrix success or path-skip
        run: |
          if [ "${{ needs.changes.outputs.integration }}" != "true" ]; then
            echo "path-skip: integration suite not required for this PR"
            exit 0
          fi
          test "${{ needs.integration-tests.result }}" = "success"

  check-language-matrix-workflow:
    name: Check language-matrix workflow exists
    needs: [changes, integration-tests]
    if: >-
      always()
      && !cancelled()
      && needs.changes.outputs.language == 'true'
      && (needs.changes.outputs.integration != 'true' || needs.integration-tests.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Detect .github/workflows/test.yml
        run: |
          if [ -f .github/workflows/test.yml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  language-matrix:
    name: Language matrix
    needs: check-language-matrix-workflow
    if: needs.check-language-matrix-workflow.outputs.exists == 'true'
    uses: ./.github/workflows/test.yml

  # Ruleset requires bare contexts "test-devenv" and "test". Matrix jobs report
  # as "Integration tests (ubuntu-…)" / reusable "Language matrix / …"; shims
  # below keep the required check names.
  ruleset-test-devenv:
    name: test-devenv
    needs: [changes, integration-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require integration matrix success or path-skip
        run: |
          if [ "${{ needs.changes.outputs.integration }}" != "true" ]; then
            echo "path-skip: integration suite not required for this PR"
            exit 0
          fi
          test "${{ needs.integration-tests.result }}" = "success"

  ruleset-test:
    name: test
    needs: [changes, check-language-matrix-workflow, language-matrix]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require language-matrix workflow success, skip, or path-skip
        run: |
          if [ "${{ needs.changes.outputs.language }}" != "true" ]; then
            echo "path-skip: language matrix not required for this PR"
            exit 0
          fi
          gate="${{ needs.check-language-matrix-workflow.result }}"
          if [ "$gate" != "success" ]; then
            echo "language-matrix gate result=$gate"
            exit 1
          fi
          exists="${{ needs.check-language-matrix-workflow.outputs.exists }}"
          result="${{ needs.language-matrix.result }}"
          if [ "$exists" = "true" ]; then
            test "$result" = "success"
          else
            test "$result" = "skipped" || test "$result" = "success"
          fi

  release:
    name: Semantic release
    needs: [changes, integration-tests]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && needs.integration-tests.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Restore Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVENV_SKIP_TAG_TESTS: "1"
        run: |
          # nixpkgs semantic-release ships analyzer, notes, npm, and github.
          # exec + git (stdlib/version.nix bump) resolve via NODE_PATH.
          plugins="${RUNNER_TEMP}/semantic-release-plugins"
          nix shell nixpkgs#nodejs --command npm install --prefix "$plugins" \
            @semantic-release/exec@7 \
            @semantic-release/git@10
          export NODE_PATH="${plugins}/node_modules${NODE_PATH:+:$NODE_PATH}"
          nix shell nixpkgs#semantic-release --command semantic-release

      - name: Save Nix store
        if: ${{ always() && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 5G
