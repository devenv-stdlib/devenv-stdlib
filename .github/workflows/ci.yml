name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-devenv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: read
      actions: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Own workspace under act
        if: ${{ env.ACT }}
        run: |
          sudo mkdir -p /home/runner/.cache/nix
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" /home/runner/.cache

      - uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        if: ${{ !env.ACT }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix') }}
          restore-prefixes-first-match: nix-${{ matrix.os }}-${{ github.job }}-
          gc-max-store-size-linux: 5G

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Test devenv
        # --show-output: devenv tasks hide captured stdout unless showOutput / this flag
        run: devenv tasks run --show-output devenv:test-devenv

      - name: Upload JUnit reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-devenv-${{ matrix.os }}
          path: junit/**/*.xml
          if-no-files-found: ignore

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test devenv (${{ matrix.os }})
          files: |
            junit/**/*.xml
          comment_mode: always
          check_run_annotations: none

  has-test-workflow:
    needs: test-devenv
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f .github/workflows/test.yml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: has-test-workflow
    if: needs.has-test-workflow.outputs.exists == 'true'
    uses: ./.github/workflows/test.yml

  release:
    needs: test-devenv
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 5G

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVENV_SKIP_TAG_TESTS: "1"
        run: nix shell nixpkgs#semantic-release --command semantic-release
