name: PR Quality

permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  anti-slop:
    runs-on: ubuntu-24.04
    steps:
      - uses: peakoss/anti-slop@v0.3.0
        with:
          close-pr: true
          exempt-draft-prs: true
          max-failures: 4
