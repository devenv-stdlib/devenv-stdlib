# The Pages site 404s until the first successful deploy of pages.yml.
# Open Collective often 403s CI crawlers.
exclude = [
  '^https://devenv4monorepo\.github\.io',
  '^https://opencollective\.com/',
]
# CI runners occasionally reset/timeout on nixos.org / brave.com.
max_retries = 3
retry_wait_time = 2
timeout = 30
accept_timeouts = true
