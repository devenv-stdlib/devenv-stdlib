[project]
name = "devenv4monorepo"
revision = "1.0"

[profiles.default]
# Optional. Empty / unset skips the Brave Search MCP.
BRAVE_API_KEY = { description = "Brave Search API key (brave.com/search/api)", required = false }
# Optional. Empty / unset skips Firecrawl unless FIRECRAWL_MCP_PROFILE=slim.
# With a key (default profile): hosted slim MCP; key is not written into mcp.json.
FIRECRAWL_API_KEY = { description = "Firecrawl API key (enables slim MCP by default; required for profile=full)", required = false }
# Optional. slim | full. Default when enabled: slim (hosted keyless URL).
FIRECRAWL_MCP_PROFILE = { description = "Firecrawl MCP profile: slim (default) or full (local stdio + API key)", required = false }
