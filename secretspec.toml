[project]
name = "devenv4monorepo"
revision = "1.0"

[profiles.default]
# 9Router dashboard login. Empty keeps the image default (123456) until set.
INITIAL_PASSWORD = { description = "9Router dashboard initial password", required = false }
# Optional. Empty / unset skips the Brave Search MCP.
BRAVE_API_KEY = { description = "Brave Search API key (free tier at brave.com/search/api)", required = false }
# Optional. Empty / unset skips the Firecrawl MCP.
FIRECRAWL_API_KEY = { description = "Firecrawl API key (free tier at firecrawl.dev)", required = false }
